[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.158.0"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://utteranc.es; connect-src 'self' https://api.github.com https://api.netlify.com; img-src *; style-src 'self' 'unsafe-inline' https://unpkg.com; frame-src 'self' https://utteranc.es; frame-ancestors 'none'"
Referrer-Policy = "same-origin"
Strict-Transport-Security = "max-age=63072000; includeSubdomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/*.{jpg,jpeg,png,gif,webp,svg,ico}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"