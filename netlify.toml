[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.158.0"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[[plugins]]
package = "netlify-plugin-image-optim"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://utteranc.es https://cloud.umami.is; connect-src 'self' https://api.github.com https://api.netlify.com https://cloud.umami.is https://gateway.umami.is; img-src *; style-src 'self' 'unsafe-inline' https://unpkg.com; frame-src 'self' https://utteranc.es; frame-ancestors 'none'"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubdomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# 2. Cache-Control untuk JavaScript
[[headers]]
  for = "**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3. Cache-Control untuk CSS
[[headers]]
  for = "**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
