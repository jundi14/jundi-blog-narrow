{{ define "main" }}
  <style>
    /* Styling default untuk tampilan Laptop/Desktop */
    .micro-article {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1.8rem;
      border-bottom: 1px solid rgba(128, 128, 128, 0.15);
    }
    .micro-date {
      flex: 0 0 60px;
      text-align: right;
      border-right: 1px solid rgba(128, 128, 128, 0.15); /* Garis vertikal */
      padding-right: 1rem;
    }
    .micro-time {
      display: flex;
      flex-direction: column;
      font-family: monospace;
      opacity: 0.6; /* Membuat semua teks di dalamnya redup */
    }
    .micro-content-wrapper {
      flex: 1;
      padding-top: 0;
    }

    /* Styling responsif untuk layar HP (lebar maksimal 640px) */
    @media (max-width: 640px) {
      .micro-article {
        flex-direction: column; /* Mengubah susunan menjadi atas-bawah */
        gap: 0.25rem; /* Jarak antara tanggal dan konten diperkecil */
      }
      .micro-date {
        flex: none;
        text-align: left; /* Tanggal rata kiri di atas konten */
        border-right: none; /* Hilangkan garis vertikal pembatas */
        padding-right: 0;
      }
      .micro-time {
        flex-direction: row; /* Jam dan tanggal menjadi sejajar menyamping */
        align-items: baseline;
        gap: 0.5rem;
      }
    }
  </style>

  <header style="margin-bottom: 2rem;">
    <h1>{{ .Title }}</h1>
    {{ if .Description }}
      <p style="opacity: 0.75; margin-top: 0;">{{ .Description }}</p>
    {{ end }}
  </header>

  <div class="micro-feed" style="margin-top: 2rem;">
    {{ range .Pages.ByDate.Reverse }}
      <article class="micro-article">

        <!-- Bagian Waktu & Tanggal -->
        <div class="micro-date">
            <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" class="micro-time">
              <span style="font-size: 0.9em;">{{ .Date.Format "15:04" }}</span>
              <span style="font-size: 0.75em;">{{ .Date.Format "Jan 2" }}</span>
            </time>
        </div>

        <!-- Bagian Konten -->
        <div class="micro-content prose micro-content-wrapper">
          {{ .Content }}
        </div>

      </article>
    {{ end }}
  </div>
{{ end }}
