name: FeedBot Micro to Bluesky

on:
  schedule:
    - cron: '*/30 * * * *' # Berjalan otomatis setiap 30 menit
  workflow_dispatch:       # Bisa dijalankan manual

permissions:
  contents: write          # Izin untuk menyimpan file cache.json ke repo

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save @atproto/api rss-parser sharp

      - name: Run Bluesky Script
        env:
          BSKY_USERNAME: 'jundi.web.id'
          BSKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node scripts/post-to-bsky.mjs

      - name: Commit and Push Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blueskyfeedbot/cache.json
          git diff --staged --quiet || git commit -m "Update Bluesky RSS cache [skip ci]"
          git push