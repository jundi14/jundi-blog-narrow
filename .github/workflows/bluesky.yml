name: FeedBot Micro to Bluesky

on:
  # Bot akan berjalan otomatis setiap kali ada file baru yang tersimpan (publish dari CMS)
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: feedbot

jobs:
  rss-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      # Jeda 2 menit untuk menunggu Vercel selesai mem-build web dan memperbarui RSS
      - name: Wait for Vercel Build
        run: sleep 270

      - name: Generate cache key
        uses: actions/github-script@v7
        id: generate-key
        with:
          script: |
            core.setOutput('cache-key', new Date().valueOf())

      - name: Retrieve cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/blueskyfeedbot
          key: feed-cache-${{ steps.generate-key.outputs.cache-key }}
          restore-keys: feed-cache-

      - name: Post RSS to Bluesky
        uses: 'joschi/blueskyfeedbot@v1'
        with:
          rss-feed: 'https://jundi.web.id/micro/index.xml'
          template: |
            {{item.description}}

            🔗 {{item.link}}
          service-url: 'https://bsky.social'
          username: 'jundi.web.id'
          password: ${{ secrets.BLUESKY_PASSWORD }}
          cache-file: ${{ github.workspace }}/blueskyfeedbot/cache.json
          initial-post-limit: 3
