- name: Install Python Requests & Jalankan Sindikasi
  env:
        BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
        BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          pip install requests
          python3 scripts/syndicate.py

- name: Simpan State Sindikasi ke Repo
  run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .syndicated-micro.json
          git diff --staged --quiet || git commit -m "chore: update micro syndication state [skip ci]"
          git push