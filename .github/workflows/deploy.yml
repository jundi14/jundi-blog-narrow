name: Build, Deploy & Syndicate Hugo

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write # Diperlukan agar bot bisa menyimpan file .syndicated.json

jobs:
  build-and-syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build with Hugo
        run: hugo --gc --minify

      # --- (Opsional) Masukkan Step Deploy ke Pages / Cloudflare di sini ---
      # Jika menggunakan Cloudflare/Vercel auto-deploy dari Git, tambahkan
      # step `sleep 30` sebelum sindikasi agar deployment selesai lebih dulu.
      - name: Setup Node.js untuk Sindikasi
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Dependencies Sindikasi
        run: npm install --no-save --no-audit --no-fund --loglevel=error @atproto/api fast-xml-parser

      - name: Jalankan Skrip Sindikasi Microblog
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node scripts/syndicate.mjs

      - name: Simpan State Sindikasi ke Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .syndicated-micro.json
          git diff --staged --quiet || git commit -m "chore: update micro syndication state [skip ci]"
          git push
